name: build-test-pack

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # OIDC token for nuget.org Trusted Publishing
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite
        ports:
          - 10000:10000
          - 10001:10001
          - 10002:10002
    steps:
      - uses: actions/checkout@v4
        with:
          # Nerdbank.GitVersioning computes the version from commit height
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build EastFive.sln -c Release

      - name: Test
        run: |
          dotnet test tests/EastFive.Api.Tests/EastFive.Api.Tests.csproj -c Release --no-build
          dotnet test tests/EastFive.Azure.Tests/EastFive.Azure.Tests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack EastFive.sln -c Release -o artifacts --no-build

      # Trusted Publishing: exchanges the workflow's OIDC token for a
      # short-lived nuget.org key (policy configured on the nuget.org account)
      - name: NuGet login
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: joshcodes

      - name: Publish to nuget.org
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

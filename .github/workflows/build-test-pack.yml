name: build-test-pack

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Nerdbank.GitVersioning computes the version from commit height
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build EastFive.sln -c Release

      - name: Test
        run: dotnet test tests/EastFive.Api.Tests/EastFive.Api.Tests.csproj -c Release --no-build
        # When EastFive.Azure.Tests lands, run Azurite as a service container here

      - name: Pack
        run: dotnet pack EastFive.sln -c Release -o artifacts --no-build

      - name: Publish to nuget.org
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if [ -z "${{ secrets.NUGET_API_KEY }}" ]; then
            echo "NUGET_API_KEY not configured; skipping publish."
            exit 0
          fi
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
